<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sổ tay Chủ nhiệm số</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='3' fill='%234B2E83'/%3E%3Cpath d='M8 12l3 3 5-6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div id="screen-loading" class="loading">Đang tải…</div>

<div id="screen-auth" class="auth oly" hidden></div>

<div id="screen-app" class="app" hidden>
  <nav class="nav" aria-label="Chức năng">
    <div class="brand"><b>Sổ tay Chủ nhiệm số</b><span id="schoolName"></span></div>
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
    <button data-v="att"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8.5 13l2.5 2.5 4.5-5"/></svg>Điểm danh</button>
    <button data-v="cmt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.5-4.5L16 5a2.1 2.1 0 0 1 3 3L8.5 18.5z"/></svg>Nhận xét</button>
    <button data-v="star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Ngôi sao</button>
    <button data-v="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Phụ huynh</button>
    <button data-v="admin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 11h5M19.5 8.5v5"/></svg>Quản trị</button>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
  </nav>
  <main>
    <header class="top oly">
      <div class="top-inner">
        <div>
          <h1 id="title">Sổ tay Chủ nhiệm số</h1>
          <div class="meta"><span id="teacher"></span><label>Ngày <input type="date" id="dateInput"></label></div>
        </div>
        <div class="top-tools">
          <label class="sr" for="classSel">Lớp đang làm việc</label>
          <select id="classSel" hidden></select>
          <button class="btn" id="acctBtn" type="button">Tài khoản</button>
        </div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
